<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1f2e" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Camera body -->
  <rect x="18" y="22" width="28" height="20" rx="2" fill="#0f1419" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Camera lens -->
  <circle cx="32" cy="32" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="5" fill="#0f1419"/>
  
  <!-- Camera flash/viewfinder -->
  <rect x="24" y="18" width="4" height="4" rx="1" fill="#ef4444"/>
  
  <!-- Alert/warning indicator (top right) -->
  <circle cx="48" cy="18" r="6" fill="#ef4444"/>
  <path d="M 48 14 L 48 18 M 48 20 L 48 22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>



